name: ci
run-name: ${{ github.event_name == 'push' && github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend branch, tag, or commit supplying the API contract
        type: string
        default: main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out authoritative API contract
        uses: actions/checkout@v4
        with:
          repository: okoscope/okoscope
          ref: ${{ inputs.backend_ref || vars.OKOSCOPE_BACKEND_REF || 'main' }}
          path: .backend-contract
          sparse-checkout: openapi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          OKOSCOPE_OPENAPI_SOURCE: .backend-contract/openapi/okoscope-v1.yaml
      - run: npm run test:e2e
      - run: docker build --build-arg OKOSCOPE_WEB_GIT_COMMIT=${{ github.sha }} -t okoscope-web:smoke .
      - run: ./scripts/container-smoke.sh okoscope-web:smoke
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable image
        if: github.event_name == 'push'
        run: |
          docker tag okoscope-web:smoke "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
      - name: Push main image alias
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag okoscope-web:smoke "$IMAGE_NAME:main"
          docker push "$IMAGE_NAME:main"
