<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From cgroup counters to resource insight</title>
  <desc id="desc">Selected container counters flow through bounded node aggregation into resource history, stable release comparison, and Attention.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#040c17"/></linearGradient>
    <linearGradient id="brand"><stop stop-color="#3458ff"/><stop offset=".52" stop-color="#08b9ff"/><stop offset="1" stop-color="#15f0bd"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#5b8bbf" stroke-opacity=".08"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#20dcd4" stroke-width="2.2"/></marker>
    <style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.card{fill:#0b1d33;stroke:#3573a6;stroke-opacity:.55;stroke-width:1.5}.eyebrow{fill:#31e6d0;font-size:13px;font-weight:800;letter-spacing:2px}.heading{fill:#edf5ff;font-size:22px;font-weight:750}.body{fill:#9eb4ce;font-size:15px}.flow{stroke:#20dcd4;stroke-width:3;marker-end:url(#arrow)}.pill{fill:#0a2037;stroke:#2d7fa9}.pillText{fill:#c4d5e7;font-size:13px}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <text x="64" y="86" fill="#edf5ff" font-size="40" font-weight="780">From resource counters to an investigation</text>
  <text x="64" y="122" class="body" font-size="18">Coverage, gaps, container identity and Release identity remain visible at every step.</text>
  <g transform="translate(64 220)"><rect class="card" width="300" height="420" rx="22"/><text class="eyebrow" x="28" y="44">OBSERVE</text><text class="heading" x="28" y="82">Container cgroups</text><text class="body" x="28" y="120">Read-only Linux counters</text><g transform="translate(28 156)"><rect class="pill" width="110" height="36" rx="18"/><text class="pillText" x="20" y="23">CPU quota</text><rect class="pill" x="126" width="116" height="36" rx="18"/><text class="pillText" x="145" y="23">Throttling</text><rect class="pill" y="52" width="110" height="36" rx="18"/><text class="pillText" x="25" y="75">Memory</text><rect class="pill" x="126" y="52" width="116" height="36" rx="18"/><text class="pillText" x="150" y="75">PSI wait</text><rect class="pill" y="104" width="110" height="36" rx="18"/><text class="pillText" x="43" y="127">I/O</text><rect class="pill" x="126" y="104" width="116" height="36" rx="18"/><text class="pillText" x="169" y="127">PIDs</text></g><text class="body" x="28" y="344">Sampled every 10–60 seconds</text><text class="body" x="28" y="374">Missing source = unavailable</text></g>
  <path class="flow" d="M364 430h72"/>
  <g transform="translate(436 220)"><rect class="card" width="300" height="420" rx="22"/><text class="eyebrow" x="28" y="44">AGGREGATE</text><text class="heading" x="28" y="82">Node agent</text><text class="body" x="28" y="120">One-minute UTC buckets</text><text class="body" x="28" y="166">Counter deltas · gauge ranges</text><text class="body" x="28" y="198">Covered time · contributors</text><text class="body" x="28" y="230">Ready replicas · containers</text><text class="body" x="28" y="262">Release identity · delivery loss</text><rect x="28" y="306" width="244" height="76" rx="14" fill="#1c1b22" stroke="#fbbf24" stroke-opacity=".65"/><text x="48" y="336" fill="#fbbf24" font-size="14" font-weight="750">Gaps remain visible</text><text class="body" x="48" y="361">Missing data never becomes zero.</text></g>
  <path class="flow" d="M736 430h72"/>
  <g transform="translate(808 220)"><rect class="card" width="300" height="420" rx="22"/><text class="eyebrow" x="28" y="44">EXPLORE</text><text class="heading" x="28" y="82">Resource history</text><path d="M32 278l48-30 44 15 49-103 48 38 47-64" fill="none" stroke="url(#brand)" stroke-width="6" stroke-linecap="round"/><path d="M32 304h236M32 210h236M32 116v210" fill="none" stroke="#547394" stroke-opacity=".38"/><text class="body" x="28" y="356">Total or per Ready replica</text><text class="body" x="28" y="386">Limits · coverage · Release markers</text></g>
  <path class="flow" d="M1108 430h72"/>
  <g transform="translate(1180 220)"><rect class="card" width="356" height="420" rx="22"/><text class="eyebrow" x="28" y="44">COMPARE &amp; REVIEW</text><text class="heading" x="28" y="82">Stable Release windows</text><text class="body" x="28" y="120">Baseline 2.1% → target 14.8%</text><text x="28" y="170" fill="#fbbf24" font-size="29" font-weight="780">+12.7 percentage points</text><text class="body" x="28" y="208">CPU throttled periods</text><rect x="28" y="252" width="300" height="96" rx="15" fill="#201722" stroke="#fb7185" stroke-opacity=".65"/><circle cx="52" cy="284" r="8" fill="#fb7185"/><text x="72" y="290" fill="#edf5ff" font-size="15" font-weight="720">Attention: throttling increased</text><text class="body" x="52" y="321">Observed after Release; cause unknown.</text><text class="body" x="28" y="386">Equal windows · warm-up excluded</text></g>
  <text x="64" y="724" fill="#edf5ff" font-size="24" font-weight="730">Read each signal literally</text><text class="body" x="64" y="762">Utilization is resource use. PSI is task waiting. Throttling is CPU quota enforcement.</text><text class="body" x="64" y="792">I/O bytes and operations are throughput; I/O PSI is waiting. Neither is disk capacity utilization.</text><text x="1536" y="842" fill="#6683a5" font-size="13" text-anchor="end">okoscope.dev · resource observation</text>
</svg>
